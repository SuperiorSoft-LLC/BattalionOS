<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calls App</title>
<style>
  body { font: 15px system-ui, sans-serif; margin: 0; padding: 16px; background: #101418; color: #e8eaed; }
  .card { border: 1px solid #2f3a44; border-radius: 10px; padding: 12px; }
  button { font: inherit; margin: 4px 0; width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #3b82f6; background: #1e3a5f; color: #fff; }
  pre { white-space: pre-wrap; word-break: break-all; font-size: 13px; }
</style>
</head>
<body>
<div class="card">
  <h2>Calls App</h2>
  <button data-cmd="os_pick_file" data-args='{"title":"Pick a file"}'>Pick a file</button>
  <button data-cmd="os_pick_folder">Pick a folder</button>
  <button data-cmd="os_open_external" data-args='{"url":"https://example.com/"}'>Open https link</button>
  <button data-cmd="os_open_external" data-args='{"url":"file:///etc/hosts"}'>Open file: link (refused)</button>
  <button data-cmd="os_notify" data-args='{"title":"Calls App","text":"Hello from an app"}'>Notify</button>
  <button data-cmd="os_scan_code">Scan a QR code</button>
  <button data-cmd="os_process_spawn">Spawn a program (refused)</button>
  <pre id="out"></pre>
</div>
<script src="app.js"></script>
</body>
</html>
