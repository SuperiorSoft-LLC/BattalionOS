<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page App</title>
<style>
  body { font: 16px system-ui, sans-serif; margin: 0; padding: 24px; background: #101418; color: #e8eaed; }
  .card { border: 1px solid #2f3a44; border-radius: 10px; padding: 16px; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid #3b82f6; background: #1e3a5f; color: #fff; }
</style>
</head>
<body>
<div class="card">
  <h1>Page App</h1>
  <p>A page-only BattalionOS app: no process part, no native code. It runs as its page on every platform.</p>
  <p>Clicks: <b id="n">0</b> <button id="b">Click</button></p>
  <p id="where"></p>
</div>
<script src="app.js"></script>
</body>
</html>
