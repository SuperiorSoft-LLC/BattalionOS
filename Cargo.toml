[workspace]
resolver = "2"
members = ["crates/battalion-app-api", "crates/battalion-host", "crates/battalion-desktop", "crates/battalion-android", "fixtures/demo-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
battalion-app-api = { path = "crates/battalion-app-api" }
