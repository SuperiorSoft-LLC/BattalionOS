[package]
name = "battalion-desktop"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
description = "BattalionOS desktop host (Tauri 2): main window, one window per app, os_* commands"
build = "build.rs"

[features]
default = ["gui"]
# The Tauri part. Without it the crate is the pure logic (labels, access, scheme server), fast to test.
test-update = []
# BOS-31 developer mode (compile time; never in a release build): an app from a folder, live reload, its own identity.
dev = ["battalion-host/dev"]
gui = ["dep:windows", "dep:webview2-com", "dep:windows-core", "dep:tauri", "dep:tauri-plugin-single-instance", "dep:tauri-build", "dep:rfd", "dep:open"]

[dependencies]
battalion-app-api.workspace = true
battalion-host = { path = "../battalion-host" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12.6", optional = true, features = ["tray-icon"] }
open = { version = "5", optional = true }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

# AND-1: desktop only (no native file dialog or single-instance plugin on Android; the system owns both there).
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri-plugin-single-instance = { version = "2", optional = true }
rfd = { version = "0.17", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
# WM-7: WebView2 MemoryUsageTargetLevel and process infos (the versions Tauri/wry already use).
webview2-com = { version = "0.39.1", optional = true }
windows-core = { version = "0.62", optional = true }
# BOS-NOTIFY-1: the WinRT toast of os_notify (the version Tauri already uses).
windows = { version = "0.62", optional = true, features = ["Data_Xml_Dom", "UI_Notifications", "Foundation"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
