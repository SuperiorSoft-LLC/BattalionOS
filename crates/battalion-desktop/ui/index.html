<!doctype html>
<html lang="en" class="dark">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" /><title>BattalionOS</title>
    <style>html,body{margin:0;background:#0e0f12}#bos-boot{position:fixed;inset:0;display:grid;place-items:center;color:#9ca3af;font:14px system-ui,sans-serif}#bos-boot img{width:min(60vw,60vh,420px);height:auto}</style>
    <!-- AND-6: taps before the shell draws are recorded (src/earlyTaps.ts replays the last one on the desktop). -->
    <script>window.__bosEarlyTaps=[];document.addEventListener("pointerup",function(e){if(!window.__bosReady)window.__bosEarlyTaps.push({x:e.clientX,y:e.clientY,t:Date.now()})},true);</script>
  </head>
  <!-- AND-6: the loading state paints with the HTML, before the bundle runs; React replaces it. -->
  <body><div id="root"><div id="bos-boot" role="status" aria-busy="true"><img src="/bos-logo.png" alt="BattalionOS, loading…"></div></div><script type="module" src="/src/main.tsx"></script></body>
</html>
