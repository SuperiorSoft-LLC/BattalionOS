[package]
name = "battalion-android"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
description = "BattalionOS on Android (Tauri 2 mobile): the same shell, Armory and app state machine as the desktop; apps run as their pages"
build = "build.rs"

# AND-1: Tauri mobile loads the OS as a library. The desktop program (battalion-desktop) is not changed by this crate.
[lib]
name = "battalion_android_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
battalion-desktop = { path = "../battalion-desktop" }
battalion-host = { path = "../battalion-host" }
tauri = { version = "2.12.6", features = [] }
serde_json.workspace = true

[features]
# BOS-AND-SELFUPDATE-1 proof builds only: read the OS feed named at build time by BOS_ANDROID_TEST_FEED (loopback http).
test-update = []

[build-dependencies]
tauri-build = { version = "2", features = [] }
