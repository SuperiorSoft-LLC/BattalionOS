[package]
name = "battalion-host"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
description = "Host base: paths, atomic store, locks, journal, app state machine"

[dependencies]
battalion-app-api.workspace = true
serde.workspace = true
serde_json.workspace = true
minisign-verify = "0.3"
base64 = "0.22"
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = "2"
libloading = "0.7"

[features]
# BOS-31 developer mode: an app from a folder, live reload. Never in a release build.
dev = []
# Tests only: BATTALION_KILL_AT=<journal step> ends the process at that step (a power cut).
crash-points = []

[dev-dependencies]
battalion-host = { path = ".", features = ["crash-points"] }
ed25519-dalek = "2"
tempfile = "3"
blake2 = "0.10"
